game: Twiddly Gems
requires:
  version: 0.6.8
  game:
    Twiddly Gems: 0.1.1

Twiddly Gems:
  progression_balancing: # UNCHANGED
    50: 99

  accessibility: # UNCHANGED
    full: 50
    minimal: 0

  goal: # UNCHANGED
    clear_last_level: 0
