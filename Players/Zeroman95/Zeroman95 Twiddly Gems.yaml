  inventory_items: # Picks random amount of Items to get in the game.
    random-range-10-20: 99

  progressive_levels: # UNCHANGED
    'false': 0
    'true': 50

  spare_unlocks: # UNCHANGED
    20: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-100: 0 # random value between 0 and 100

  exclude_gold_and_silver: # Another two AP Gems are in each level now to exclude the very hard Silver and Gold Scores.
    'false': 0
    'true': 50

  trap_percent: # Same percentage as Spare Unlocks.
    20: 100

  inventory_item_chance: # UNCHANGED
    cross_clear: 50
    rainbow: 50
    rocket: 50
