        - White Gel
        - Lasers
        - Aerial Faith Plates
        - Excursion Funnels
        - Hard Light Bridges
        - Laser Relays
        - Laser Catchers
        - Turrets
      replacement_item: null
      skip_if_solo: true

  plando_items: []
