name: Jack5KMK{NUMBER}
description: |-
  Jack5's Keymaster's Keep player file

  This Keymaster's Keep configuration combines Jack5's non-Archipelago-supported games and interests into a single player file, which is more condensed than the Keymaster's Keep default for both simplicity and an added challenge. The main difference is the goal being changed from 'Keymaster's Challenge' to either 'Magic Key Heist' or 'Area Domination', so this config's completion does not hinge on a single challenge. This config is based on `Multi Keymaster's Keep.yaml`, which was shared between Jack5, Zeroman95 and others, and also pulls in the old `Jack5 Tomodachi Life LtD (KMK).yaml` file.
game: Keymaster's Keep
requires:
  version: 0.6.7
  game:
    Keymaster's Keep: 2.1.5
Keymaster's Keep:
  ################
  # Game Options #
  ################
  # Unchanged from the base configuration.
  progression_balancing:
    normal: 50
  accessibility:
    full: 50
  ################
  # Goal Options #
  ################
  goal:
    # Determines the victory condition.
    # Keymasters Challenge: Retrieve X artifacts of resolve to unlock the Keymaster's challenge chamber and beat the ultimate challenge
    # Magic Key Heist: Acquire X magic keys and escape the Keymaster's Keep
    # Area Domination: Acquire conquest medallions by completing all trials in X% of keep areas and escape the Keymaster's Keep
    # Rather than having the entire run hinge on a final challenge (which we've never played) or require a certain number of keys, require a certain number of areas to be completed.
    # I have played Keymaster's Keep many times, and my preferred goals are Magic Key Heist and Area Domination. Because there is a time and a place for both, and they are equally good when compared to each other, there is a random chance that either will be selected. The Keymaster's Challenge is not desired due to the game hinging on a single area.
    keymasters_challenge: 0
    magic_key_heist: 50
    area_domination: 50
  artifacts_of_resolve_total:
    # Determines how many Artifacts of Resolve are in the item pool.
    # Only relevant if the selected goal is Keymaster's Challenge.
    # You can define additional values between the minimum and maximum values. Minimum value is 3, maximum value is 25.
    # Irrelevant as my goal is not Keymaster's Challenge.
    5: 50
  artifacts_of_resolve_required:
    # Determines how many Artifacts of Resolve are required to unlock the Keymaster's challenge room.
    # Only relevant if the selected goal is Keymaster's Challenge.
    # You can define additional values between the minimum and maximum values. Minimum value is 1, maximum value is 25.
    # Irrelevant as my goal is not Keymaster's Challenge.
    3: 50
  magic_keys_required:
    # Determines how many Magic Keys are required before escaping the Keymaster's Keep.
    # Only relevant if the selected goal is Magic Key Heist.
    # You can define additional values between the minimum and maximum values. Minimum value is 10, maximum value is 50.
    # This is a legacy option that was being used when my goal was Magic Key Heist. This was reduced to roughly half of the default keep generation options in order to align with the chosen .py files and to be more manageable. This particular value has gone from 66% of the total magic keys to roughly 90%. It cannot be any lower than 10.
    10: 50
  conquest_medallions_percentage_required:
    # Determines the percentage of Conquest Medallions required before escaping the Keymaster's Keep. Completing all trials in a keep awards a Conquest Medallion.
    # Only relevant if the selected goal is Area Domination.
    # Even with the inclusion of Consumables, if this value is made too high, it makes completing Keymaster's Keep too difficult. Since Magic Key Heist has been restored as a potential goal, this value has been reduced from 80% (10/12-13 areas) to make it more in line with the effort required to complete Magic Key Heist (now 60%, 8/13 areas).
    60: 50
  ###########################
  # Keep Generation Options #
  ###########################
  keep_areas:
    # Determines how many areas are in the Keymaster's Keep.
    # Each area will contain a new set of trials and most will be locked by one or more keys.
    # You can define additional values between the minimum and maximum values. Minimum value is 10, maximum value is 100.
    # This has been reduced to roughly half all of the default keep generation options in order to align with the chosen .py files and to be more manageable. This particular value has been increased from 10 to 12 to bring the number of checks closer to 150. Increased by 1 with the inclusion of Consumables, trials that do not require effort to complete.
    13: 50
  magic_keys_total:
    # Determines how many Magic Keys are in the item pool.
    # The keys in that pool will be used to generate the lock combinations for areas in the Keymaster's Keep. They will also act as the amount of available keys to the player in the Magic Key Heist goal.
    # You can define additional values between the minimum and maximum values. Minimum value is 10, maximum value is 50.
    # This has been reduced to roughly half all of the default keep generation options in order to align with the chosen .py files and to be more manageable. As there are 2 unlocked areas by default, the remaining keeps are locked with a single key.
    10: 50
  unlocked_areas:
    # Determines how many areas are unlocked at the start of the game.
    # The remaining areas will be locked by one or more keys.
    # You can define additional values between the minimum and maximum values. Minimum value is 1, maximum value is 5.
    # Ensures that either two games (or Consumables and one game) are present at the start of the run.
    2: 50
  lock_magic_keys_minimum:
    # Determines the minimum amount of Magic Keys that could be required to unlock an area.
    # The amount of keys required to unlock an area will be a random number between this value and the maximum. Note that this option will be ignored for the first few areas to ensure the game is completable.
    # You can define additional values between the minimum and maximum values. Minimum value is 1, maximum value is 5.
    # Unchanged from the base configuration.
    1: 50
  lock_magic_keys_maximum:
    # Determines the maximum amount of Magic Keys that could be required to unlock an area.
    # The amount of keys required to unlock an area will be a random number between the minimum and this value. Note that this option will be ignored for the first few areas to ensure the game is completable.
    # You can define additional values between the minimum and maximum values. Minimum value is 1, maximum value is 5.
    # As there are very few keeps, it would not make sense to have one be locked by 3 keys at once.
    2: 50
  area_trials_minimum:
    # Determines the minimum amount of trials that could be in an area.
    # The amount of trials in an area will be a random number between this value and the maximum, but might get adjusted upwards to hold the item pool size.
    # You can define additional values between the minimum and maximum values. Minimum value is 1, maximum value is 25.
    # The default of these has the trial count hovering around 5. This had been changed to hover around 10 in order to increase the number of checks to approximately 150, but now hovers around 6.5 due to the length of Keymaster's Keep not working well in a multiworld.
    5: 50
  area_trials_maximum:
    # Determines the maximum amount of trials that could be in an area.
    # The amount of trials in an area will be a random number between the minimum and this value, but might get adjusted upwards to hold the item pool size.
    # You can define additional values between the minimum and maximum values. Minimum value is 1, maximum value is 25.
    # The default of these has the trial count hovering around 5. This had been changed to hover around 10 in order to increase the number of checks to approximately 150, but now hovers around 6.5 due to the length of Keymaster's Keep not working well in a multiworld.
    8: 50
  shops_:
    # If true, keep areas will have a chance to be replaced by a shop that will sell a handful of items.
    # The presence of shops will add Unique Relics to the item pool, which will need to be found to purchase items.
    # Yes, the option is named "shops_". Thank you, ALTTP!
    # After trying out shops, it can confidently be said that they distract from the point of Keymaster's Keep, especially since it is not obvious that an unlocked area is a shop. The addition of shops also makes the effect of other options less clear.
    'false': 50
    'true': 0
  shops_percentage_chance:
    # Determines the percentage chance of a shop overriding a keep area when shops are enabled.
    # A maximum of 10 shops can exist in the keep at once.
    # You can define additional values between the minimum and maximum values. Minimum value is 5, maximum value is 50.
    # This was reduced to 8% so that only a single shop would appear with 13 areas, but it being a chance instead of a guarantee means that there could be 0, 2 or more shops instead.
    8: 50
  shop_items_minimum:
    # Determines the minimum amount of items that could be sold in a shop.
    # The amount of items sold in a shop will be a random number between this value and the maximum.
    # You can define additional values between the minimum and maximum values. Minimum value is 1, maximum value is 5.
    # Increased from the default of 2 to make sure there is something more substantial about the shops.
    3: 50
  shop_items_maximum:
    # Determines the maximum amount of items that could be sold in a shop.
    # The amount of items sold in a shop will be a random number between the minimum and this value.
    # You can define additional values between the minimum and maximum values. Minimum value is 1, maximum value is 5.
    # Unchanged from the base configuration.
    5: 50
  shop_items_progression_percentage_chance:
    # Determines the percentage chance of each item in a shop being a guaranteed progression item.
    # Since items are purchased with unique relics, it is recommended to set this value on the higher side. Each unique relic will only be able to unlock a single item in the keep, so ideally, they are worth the trouble.
    # You can define additional values between the minimum and maximum values. Minimum value is 0, maximum value is 100.
    # Irrelevant because I am not playing with shops.
    100: 50
  shop_hints:
    # If true, upon discovering a shop, hints will be generated for the items sold in that shop.
    # Irrelevant because I am not playing with shops.
    'false': 50
    'true': 0
  ######################################
  # Game / Objective Selection Options #
  ######################################
  include_adult_only_or_unrated_games:
    # Determines if adult only or unrated games should be considered for the game pool.
    # Can be a useful filter to adhere to the rules of certain communities.
    # Unchanged from the base configuration.
    'false': 50
    'true': 0
  include_modern_console_games:
    # Determines if modern console games should be considered for the game pool.
    # Can be a useful filter to adhere to the rules of certain communities.
    # Unchanged from the base configuration.
    'false': 0
    'true': 50
  include_difficult_objectives:
    # Determines if difficult objectives should be considered.
    # Enabling this option might yield objectives that some players will struggle or not be able to complete.
    # If enabled, you can still exclude specific games with the 'excluded_games_difficult_objectives' option.
    # I want to allow certain objectives that are difficult but are acceptable to appear.
    'false': 0
    'true': 50
  excluded_games_difficult_objectives:
    # When 'include_difficult_objectives' is enabled, this option allows you to still exclude specific games.
    # Only game names originally listed in 'game_selection' are accepted.
    # If a game specified here only offers difficult objectives, this option will have no effect for it.
    # Repopulated with games where difficult objectives are disallowed.
    - Asphalt Legends (IOS + AND, PC, PS4, PS5, SW, XONE, XSX)
    - Backloggery (META)
    - Bloons TD 6 (PC + AND, IOS, PS4, XONE)
    - Consumables (META)
    - Dominion (BOARD + AND, IOS, PC)
    - 'Gran Turismo 3: A-Spec (PS2)'
    - Left 4 Dead 2 (PC + X360)
    - PlatinumQuest (MOD)
    # - Portal (PC + PS3, SW, X360) - allowed
    - 'Tomodachi Life: Living the Dream (SW)'
    - Tower Unite (PC)
    - Trivia Tricks (PC)
  include_time_consuming_objectives:
    # Determines if time-consuming objectives should be considered.
    # Enabling this option might yield objectives that take much longer to complete (i.e. more than 1 hour).
    # If enabled, you can still exclude specific games with the 'excluded_games_time_consuming_objectives' option.
    # I want to allow certain objectives that are time consuming but are acceptable to appear.
    'false': 0
    'true': 50
  excluded_games_time_consuming_objectives:
    # When 'include_time_consuming_objectives' is enabled, this option allows you to still exclude specific games.
    # Only game names originally listed in 'game_selection' are accepted.
    # If a game specified here only offers time-consuming objectives, this option will have no effect for it.
    # Repopulated with games where time consuming objectives are disallowed.
    - Asphalt Legends (IOS + AND, PC, PS4, PS5, SW, XONE, XSX)
    - Backloggery (META)
    - Bloons TD 6 (PC + AND, IOS, PS4, XONE)
    - Consumables (META)
    - Dominion (BOARD + AND, IOS, PC)
    - 'Gran Turismo 3: A-Spec (PS2)'
    - Left 4 Dead 2 (PC + X360)
    - PlatinumQuest (MOD)
    - Portal (PC + PS3, SW, X360)
    - 'Tomodachi Life: Living the Dream (SW)'
    - Tower Unite (PC)
    - Trivia Tricks (PC)
  hints_reveal_objectives:
    # Determines if Archipelago hints will provide information about a location's objective.
    # Enabling this option will potentially spoil the game for an area and the objective that needs to be completed.
    # Unchanged from the base configuration.
    'false': 50
    'true': 0
  game_medley_mode:
    # If true, a percentage of keep areas will feature Game Medley as their game, with each trial sourced randomly from a separate, dedicated pool of games.
    # Activating Game Medley Mode will disable optional game conditions for keep areas assigned to Game Medley.
    # This has been enabled in order to give Game Medley a chance, though its chance of occurring should be low considering it is harder to earn a Conquest Medallion from it.
    'false': 0
    'true': 50
  game_medley_percentage_chance:
    # Determines the percentage chance of a game medley being selected when Game Medley Mode is enabled.
    # You can define additional values between the minimum and maximum values. Minimum value is 1, maximum value is 100.
    # Reduced to a mere 5% to make Game Medley very unlikely to occur.
    5: 50
  game_medley_game_selection:
    # Defines the game pool that will be used to generate Game Medley trials.
    # Only game names originally listed in 'game_selection' are accepted.
    # You are allowed to place games that already appear in other selection options here.
    # You are allowed to add the same game multiple times here. This will act as a weighted pool.
    # If this is left empty, all games from other selection options will be used as a default.
    # Game Medley contains all video games, not Consumables.
    - Asphalt Legends (IOS + AND, PC, PS4, PS5, SW, XONE, XSX)
    - Backloggery (META)
    - Bloons TD 6 (PC + AND, IOS, PS4, XONE)
    - Dominion (BOARD + AND, IOS, PC)
    - 'Gran Turismo 3: A-Spec (PS2)'
    - Left 4 Dead 2 (PC + X360)
    - PlatinumQuest (MOD)
    - Portal (PC + PS3, SW, X360)
    - 'Tomodachi Life: Living the Dream (SW)'
    - Tower Unite (PC)
    - Trivia Tricks (PC)
  game_selection:
    # Defines the game pool to select from.
    # All supported games are listed. Remove the ones you don't own or want to play.
    # You are allowed to add the same game multiple times here. This will act as a weighted pool.
    # All of my preferred games from `Multi Keymaster's Keep.yaml` have been copied over to here plus 'Backloggery (META)' and 'Tomodachi Life: Living the Dream (SW)'.
    - Asphalt Legends (IOS + AND, PC, PS4, PS5, SW, XONE, XSX)
    - Backloggery (META)
    - Bloons TD 6 (PC + AND, IOS, PS4, XONE)
    - Consumables (META)
    - Dominion (BOARD + AND, IOS, PC)
    - 'Gran Turismo 3: A-Spec (PS2)'
    - Left 4 Dead 2 (PC + X360)
    - PlatinumQuest (MOD)
    - Portal (PC + PS3, SW, X360)
    - 'Tomodachi Life: Living the Dream (SW)'
    - Tower Unite (PC)
    - Trivia Tricks (PC)
  game_selection_bag_size:
    # Determines the size of the bag from which the weighted games in 'game_selection' and 'game_medley_game_selection' will be randomly selected.
    # 0: No bag will be used and games may appear multiple times unbounded.
    # 1: The bag will be filled with 1 of each game and will be drawn from randomly until it is empty, resulting in an even distribution of games. If the bag becomes empty, it will be refilled.
    # 2+: The bag will initially be filled with the chosen number of each game, resulting in a slightly less even distribution of games where the maximum number of each game is the chosen number. Subsequent fills will revert to an even distribution. Similar logic applies for all other bag sizes.
    # You can define additional values between the minimum and maximum values. Minimum value is 0, maximum value is 5.
    # Unchanged from the base configuration.
    1: 50
  game_selection_force_select:
    # Forces certain games to become areas, selected and placed randomly from this list. This option does not affect shops or the Keymaster's challenge room. If more games than permitted areas are specified, this option will cause an error. 'game_selection_bag_size' will treat games added by this option as if they have been pre-drawn from their respective bags.
    # You are allowed to add the same game multiple times here. This will cause that many instances of the game to appear as areas.
    # Consumables has been added to this list to ensure it appears at least once.
    - Consumables (META)
  ######################
  # Consumables (META) #
  ######################
  # consumables_min_rarity:
  # The minimum rarity required for consumables to appear. Increasing this will raise the overall power of consumables.
  # You can define additional values between the minimum and maximum values. Minimum value is 0, maximum value is 6.
  # As this is unchanged from the base configuration, it is omitted in case the values change.
  # consumables_max_rarity:
  # The maximum rarity allowed for consumables to appear. Reducing this will lower the overall power of consumables.
  # You can define additional values between the minimum and maximum values. Minimum value is 0, maximum value is 6.
  # As this is unchanged from the base configuration, it is omitted in case the values change.
  consumables_banned_types:
    # The list of consumable types banned from appearing. A consumable's types can be found in the `consumables()` method of the source code. "on_hint" and "on_shop" are banned by default, "on_hint" in order to get players used to the concept of consumables, and "on_shop" as it is uncommon for players of Keymaster's Keep to have shops enabled. To allow these conditional consumables to appear, set this to an empty list.
    # 'on_hint' has been removed from the list to allow its consumables to appear.
    - on_shop
  # consumables_custom:
  # A dictionary of custom content to add to the implementation. Currently accepts a list of consumables under the key `consumables`, which obey the `consumables_min_rarity`, `consumables_max_rarity` and `consumables_banned_types` options, each of which is expected to have the following keys:
  #     - `name` (str) - The name of the consumable.
  #     - `description` (str) - The description of the consumable.
  #     - `rarity` (str | int, optional) - The rarity of the consumable, as it is represented in the `ConsumableRarity` enum. Defaults to 0.
  #     - `types` (list[str], optional): The types of the consumable, used in filtering. Defaults to [].
  #     - `creators` (str | list[str], optional) - The people that came up with the idea for the consumable. Defaults to "Custom".
  # As this is unchanged from the base configuration, it is omitted in case the way the option's values are stored changes.
  consumables_show_names:
    # Whether to show consumable names at the start of their descriptions.
    # Unchanged from the base configuration.
    'false': 0
    'true': 50
  consumables_show_rarities:
    # Whether to show consumable rarities at the end of their descriptions.
    # Unchanged from the base configuration.
    'false': 0
    'true': 50
  # consumables_show_creators:
  # Whether to show consumable creators at the end of their descriptions.
  # Unchanged from the base configuration.
  # 'false': 50
  # 'true': 0
  # As no third-party contributions have been made to the Consumables implementation, the creators option is omitted as it may be removed in a future update.
  ###################################
  # Dominion (BOARD + AND, IOS, PC) #
  ###################################
  dominion_weights:
    # The weights to use for Dominion objective types. Note that "win_with_card" and half of "win_against_ai" are classified as difficult, and will not appear if difficult objectives are disabled. Defaults to only objectives that can be completed in real life. If playing the 2021 version of Dominion by Temple Gates Games, it is recommended to start with the following weights:
    # ```yaml
    # setup_with_cards: 1
    # play_card: 8
    # win_with_card: 1
    # win_against_ai: 1
    # bonus: 2
    # ```
    # Since we are playing the video game, we've changed the weights to include video game objectives.
    bonus: 2
    play_card: 8
    setup_with_cards: 1
    win_against_ai: 1
    win_with_card: 1
  dominion_expansion_weights:
    # The weights to use for expansions in Dominion objectives. Expansions are based on the 2021 version of Dominion by Temple Gates Games, where "...1st Edition" expansions only contain cards exclusive to them. Weights are proportional to the number of cards in their respective expansions. Defaults to only including the base game.
    # These weights have been changed to include all of the DLC that Jack5 owns, which can be played by everyone.
    Adventures: 0
    Alchemy: 0
    Allies: 0
    Base: 1
    Base 1st Edition: 0
    Black Market: 1
    Cornucopia: 1
    Cornucopia 1st Edition: 1
    Dark Ages: 0
    Empires: 1
    Guilds: 0
    Guilds 1st Edition: 0
    Hinterlands: 1
    Hinterlands 1st Edition: 0
    Intrigue: 1
    Intrigue 1st Edition: 0
    Marchland: 1
    Menagerie: 0
    Nocturne: 0
    Plunder: 1
    Promo Pack 1: 0
    Promo Pack 2: 0
    Prosperity: 1
    Prosperity 1st Edition: 1
    Renaissance: 1
    Rising Sun: 0
    Seaside: 0
    Seaside 1st Edition: 0
  ################################
  # Gran Turismo 3: A-Spec (PS2) #
  ################################
  gran_turismo_3_include_arcade_mode:
    # Allow Arcade Mode races as objectives
    # Unchanged from the base configuration.
    'false': 0
    'true': 50
  gran_turismo_3_include_career_mode:
    # Allow Gran Turismo Mode races as objectives
    # Unchanged from the base configuration.
    'false': 0
    'true': 50
  gran_turismo_3_career_sections:
    # Which parts of Gran Turismo Mode are allowed for objectives:
    # - Licenses
    # - Beginner League
    # - Amateur League
    # - Professional League
    # - Endurance League
    # - Rally Events
    # Unchanged from the base configuration.
    - Licenses
    - Beginner League
    - Amateur League
    - Professional League
    - Endurance League
    - Rally Events
  #######################
  # PlatinumQuest (MOD) #
  #######################
  platinumquest_level_packs:
    # Indicates which PlatinumQuest level packs the player wants to include when generating objectives.
    # Unchanged from the base configuration.
    - Gold
    - Ultra
    - Platinum
    - PlatinumQuest
    - PlatinumQuest Locked
    - Hunt
    - Hunt Snow
    - Hunt Fright
  platinumquest_difficulties:
    # Indicates which PlatinumQuest difficulties the player wants to include when generating objectives.
    # Unchanged from the base configuration.
    [ 'Tutorial', 'Beginner', 'Intermediate', 'Advanced', 'Expert', 'Bonus' ]
  ###############################
  # Portal (PC + PS3, SW, X360) #
  ###############################
  # portal_weights:
  # The weights to use for Portal objective types. Note that "dinosaur_in_chamber", "complete_advanced_chamber", two-thirds of "challenges" and half of "bonus" are classified as difficult, and will not appear if difficult objectives are disabled.
  # As these are unchanged from the base configuration, they have been omitted in case the default weights change.
  # portal_challenge_weights:
  # The weights to use for challenge types in Portal objectives.
  # As these are unchanged from the base configuration, they have been omitted in case the default weights change.
  #########################################
  # Tomodachi Life: Living the Dream (SW) #
  #########################################
  tomodachi_life_living_the_dream_weights:
    # The weights to use for Tomodachi Life: Living the Dream objective types. The default weights include objectives that require a player to give specific Miis specific items, which would be undesirable for players that want to keep their Miis accurate. If this is the case, set all "named_mii_named_..." weights to 0 except "named_mii_named_food".
    # I have disabled the inaccurate objectives according to the above instructions.
    any_mii_named_clothing: 6
    any_mii_named_exterior: 2
    any_mii_named_food: 6
    any_mii_named_interior: 4
    any_mii_named_level_up_gift: 4
    any_mii_named_treasure: 4
    bonus: 20
    named_mii_any_clothing: 3
    named_mii_any_exterior: 1
    named_mii_any_food: 3
    named_mii_any_interior: 2
    named_mii_any_level_up_gift: 2
    named_mii_any_treasure: 2
    named_mii_named_clothing: 0
    named_mii_named_exterior: 0
    named_mii_named_food: 3
    named_mii_named_interior: 0
    named_mii_named_level_up_gift: 0
    named_mii_named_treasure: 0
    place_facility: 1
    place_landscapes: 2
    place_objects: 8
  tomodachi_life_living_the_dream_skip_locked_items:
    # Whether Tomodachi Life: Living the Dream objectives involving items should include a notice that allows them to be skipped if their items are not unlocked or owned by the player, depending on the item type. Defaults to true.
    # Unchanged from the base configuration.
    'false': 0
    'true': 50
  tomodachi_life_living_the_dream_trash:
    # Whether to allow trash items ('Box of tissues' and 'Roll of toilet paper') to appear as part of Tomodachi Life objectives.
    # Unchanged from the base configuration.
    'false': 50
