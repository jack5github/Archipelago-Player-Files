name: Jack5RoadTrip{NUMBER}
description: |-
  Jack5's Road Trip Adventure player file

  TODO: Add description
game: Road Trip Adventure
requires:
  version: 0.6.7
  game:
    Road Trip Adventure: 0.2.0
Road Trip Adventure:
  ################
  # Game Options #
  ################
  # Unchanged from the base configuration.
  progression_balancing:
    normal: 50
  accessibility:
    full: 50
  # TODO: When a new goal condition is added to simply complete all Q's Factory races rather than to become the president, switch to that goal
  area_unlock_mode:
    # In RTA AP, in order to interact with anything in a town (enter houses, talk to cars, etc.), you must unlock the town first.
    # In **Decorations** mode, you must obtain one of the garage decorations associated with that town to unlock it.
    # Every town has 2. (A couple of towns lacking garage decorations use wallpapers instead.)
    # In **Stamps** mode, 100 stamp items are added into the pool. Every 5 stamp items you get unlocks the next town.
    # Unchanged from the base configuration to ensure variety.
    decorations: 50
    stamps: 0
  remove_double_up_stamps:
    # If using Decorations mode, enable this to combine NPC rewards and stamps that are received back-to-back into one location (e.g. Stamp 2, and many many others).
    # Applies to roughly half of the stamps in the game.
    # This cannot be enabled in Stamps mode, as it would bring the number of locations well below the number of items.
    # Enabled to reduce the number of locations.
    'false': 0
    'true': 50
  additional_progressive_part_tracks:
    # Add additional progressive part tracks to the item pool. Defaults to 2, one for each of your teammates.
    # These parts can also be used by you, or just sold for money at the Recycle Shop.
    # Leaving this at 2 is recommended for Decorations mode.
    # In Stamps mode, lowering this to 1 is worth considering. When set to 2 in Stamps mode, most cosmetic/filler items (horns, meters, etc.) will have to be removed from the item pool in order to make enough space. (If this is fine, leave at 2.)
    # Setting to 0 is not recommended, as it makes finding part upgrades a bit rare.
    # You can define additional values between the minimum and maximum values. Minimum value is 0, maximum value is 2.
    # Unchanged from the base configuration due to using Decorations mode.
    2: 50
  prioritize_good_rewards_for_races:
    # Set the percent chance that a race will be forced to have a Progression item. (Rolled separately for each race.)
    # Before items are placed, a random number between 1 and 100 is rolled for each race.
    # If the number is equal to or below the value selected here, the item will be guaranteed to be Progression.
    # This provides more incentive to complete races, which require more skill and time than most stamps.
    # Since this is rolled for *each* race, it is not a guarantee that a certain percentage of races will have Progression items - just that on average, they will.
    # You can define additional values between the minimum and maximum values. Minimum value is 0, maximum value is 100.
    # Unchanged from the base configuration.
    50: 50
  prioritize_good_rewards_for_minigames:
    # Set the percent chance that a minigame will be forced to have a progression item. (Rolled separately for each minigame.)
    # Works the same way as the setting for races.
    # Several minigames are not included due to lack of a meaningful challenge (notably Q's Rally, fishing, and the Figure 8 courses, since none of these have time limits).
    # You can define additional values between the minimum and maximum values. Minimum value is 0, maximum value is 100.
    # Unchanged from the base configuration.
    25: 50
  license_handling:
    # Set how license items/locations should be handled.
    # Standard: Licenses are awarded via Progressive License items found in the multiworld. License completions are locations.
    # Vanilla: Force the license unlock items to be in their vanilla locations. (e.g. a Progressive License will always be found at Rank C completion, etc.)
    # Remove: Start with all licenses. License completions are *not* locations.
    # Unchanged from the base configuration.
    standard: 50
    vanilla: 0
    remove: 0
  parts_cost_modifier:
    # Set a percentage modifier for the cost of parts. If set to 0, all parts will be free.
    # You can define additional values between the minimum and maximum values. Minimum value is 0, maximum value is 100.
    # Unchanged from the base configuration.
    100: 50
  parts_cost_maximum:
    # Set the maximum cost for a part. This maximum is applied *after* the percentage modifier above.
    # If set to -1 (default), no maximum will be applied.
    # If set to 0, all parts will be free.
    # You can define additional values between the minimum and maximum values. Minimum value is -1, maximum value is 200000.
    # Unchanged from the base configuration.
    -1: 50
  auto_unlock_warps:
    # Automatically unlock the ability to warp to a town's Q's Factory when you gain access to it.
    # Enabled to reduce the amount of time I need to spend driving.
    'false': 0
    'true': 50
  ###########################
  # Item & Location Options #
  ###########################
  local_items: []
  non_local_items: []
  start_inventory:
    # I want to start with the steering and braking upgrades, as driving around the open world is a lot harder when I have absolutely no upgrades at all.
    Progressive Brakes: 1
    # After testing, I found that 1 steering upgrade was not enough, so I've added another.
    Progressive Steering: 2
    # Also start with all billboards, so that I can earn money just by driving through the world right from the start without needing to worry what locations I have unlocked.
    Billboard - Coffee Shop: 1
    Billboard - Noodle Shop: 1
    Billboard - Cake Shop: 1
    Billboard - Wool Shop: 1
    Billboard - Coconut Shop: 1
  start_hints:
    # Area Unlocks are incredibly important items that should be hinted from the start, so that everyone knows what to do in order to progress Road Trip Adventure.
    - Area Unlocks
    # Similarly, I also want to get Progressive Licenses earlier, because then I can spend more time racing as opposed to driving through the open world.
    - Progressive License
    # The Jet Turbine is a crazy late-game item that makes it possible to build up extreme speed along straights even without good parts. It is also an absolute requirement for the golf minigame.
    - Jet Turbine
  # Getting location hints is a great way of looking into minigames to figure out if they are even worth playing. This is what Spyro: A Hero's Tail does. Unfortunately, there are so many minigames in Road Trip Adventure that if I were to put them all here, the hint list would be completely cluttered and it would be very difficult to use the Universal Tracker. Therefore, leave this empty.
  start_location_hints: []
  exclude_locations:
    # The below stamps require you to visit all the houses in specific areas. There is no in-game tracker nor AP tracker for what houses you have visited, therefore it doesn't make sense to lock AP items behind these.
    - Stamp 1 # Peach Town
    - Stamp 10 # Fuji City
    - Stamp 23 # Sandpolis
    - Stamp 52 # Chestnut Canyon
    - Stamp 60 # White Mountain
    - Stamp 72 # Papaya Island
    - Stamp 85 # Cloud Hill
    - Stamp 91 # Mushroom Road
    # The below stamps are time trial versions of prior stamps, and are excluded due to their potential difficulty given how hard it is to come by certain items.
    - Stamp 15 # Fuji City Treasure Maze (3:00)
    - Stamp 22 # Fuji City Highway Race (0:50)
    - Stamp 28 # Sandpolis Drag Race (0:08)
    - Stamp 56 # Chestnut Canyon Volcano Course (1:10)
    - Stamp 58 # Chestnut Canyon Rock Climbing (2:00)
    - Stamp 76 # Papaya Island Obstacle Course (2:00)
    # This stamp is an 8-step process that has you driving all around the map talking to NPCs in order to deliver a magazine. Like the above, there is no in-game tracker nor AP tracker for what NPCs you have talked to, and I don't want all this effort to be required for a critical item.
    - Trade Quest
    - Stamp 7
    - Body Q150 # Extra reward
    - Body Q150 / Stamp 7 # Doubled-up name
    # Like the stamp above this one, Stamp 9 is a fetch quest that requires you to find 7 gemstones throughout the world. Same old story of there being no in-game nor AP tracker, so this stamp and all the gemstones are excluded (except Emerald and Amethyst which are easy to find around White Mountain).
    - Blue Sapphire
    - Ruby
    - Topaz
    - Black Opal
    - Moonstone
    - Stamp 9
    - Body Q087 # Extra reward
    - Body Q087 / Stamp 9 # Doubled-up name
    # Stamp 16 is a drag-then-stop race that Archipelago logic expects that you are able to beat when that straight-up isn't possible.
    - Stamp 16
    # The Fountain Pen is an object that is only able to be reached by driving up the ruined temple, and it is in logic before my car is able to climb up the stairs.
    - Fountain Pen
    # This stamp is a 3-part (maybe 4-part) process that involves travelling all across the map to perform various actions and talk to a few NPCs. Excluded due to being time consuming.
    - Stamp 41
    - Flower Pattern # Extra reward
    - Flower Pattern / Stamp 41 # Doubled-up name
    # The mother of all fetch quests, this stamp requires collecting all 100 ChoroQ coins. Ain't no way in hell I'm doing that. I'm also excluding some of the Coine Rewards that require an extreme number of ChoroQ coins to collect.
    - Stamp 46
    - Coine Reward 9 (Metal Pad)
    - Coine Reward 10 (Hyper MAX)
    - Coine Reward 10 (Hyper MAX) / Stamp 46 # Doubled-up name
    # Stamp 48 is the Rally, an extremely long sprint that goes all over the map and requires specific tyres for each region.
    - Stamp 48
    - Body Q089 # Extra reward
    - Body Q089 / Stamp 48 # Doubled-up name
    # Stamp 49 is the Endurance Race, an extremely long circuit that lasts for 10 laps.
    - Stamp 49
    # Stamp 50 and 51 both require extreme attention to detail when it comes to NPC chatter within My City.
    - Stamp 50
    - Stamp 51
    # An 8-part fetch quest all over some suspicion of ghosts in the Road Trip Adventure world.
    - Stamp 63
    - Body Q037 # Extra reward
    - Body Q037 / Stamp 63 # Doubled-up name
    # This one involves going back and forth between two NPCs in two very far-removed locations.
    - Stamp 71
    - Body Q082 # Extra reward
    - Body Q082 / Stamp 71 # Doubled-up name
    # Stamp 80 requires that an NPC named Shirley is present in the vacant house in Papaya Island, but I don't know what the conditions are to spawn her.
    - Stamp 80
    # Stamp 90 is an impossible jump that requires flying from a cramped space with invisible walls everywhere. It also apparently requires 60-100 tries to make it.
    - Stamp 90
    - Rainbow Meter # Extra reward
    - Rainbow Meter / Stamp 90 # Doubled-up name
    # The picture-taking version of Stamp 46. Not a chance in the world of me completing this.
    - Stamp 96
    # Stamp 100 is the World Grand Prix and the race against the President. This 7-race championship requires that I and my two other party members have the best possible parts and get high places in each race, to the point that any failure to do so is an extreme penalty. This is also the normal win condition of Road Trip Adventure, which is absolutely insane.
    - Stamp 100
    # I just don't know where to find this, and it being an early check infuriates me to no end.
    - Police Light
    # The following shop purchases are too expensive and require lots of grinding to obtain.
    - Shop Purchase - Black MAX Engine
    - Shop Purchase - RS Magnum Engine
    - Shop Purchase - Flight Wing
    # The Super A License requires that I win every single race, which I may not have done and can't easily backtrack to redo.
    - Super A License Obtained
  priority_locations: []
  item_links: []
  plando_items:
    # In order to have any luck finding ChoroQ coins, I need to have the Coin Radar at some point during the start of a run. This plando ensures that it will appear within the first sphere in a different world.
    - items:
        Coin Radar: true
      world: true
      location: early_locations
      force: false
