name: ZeromanPikmin2{NUMBER}

description: Zeroman95s Pikmin 2 YAML

game: Pikmin 2
requires:
  version: 0.6.7
  game:
    Pikmin 2: 0.8.1

Pikmin 2:
  progression_balancing: # UNCHANGED
    50: 99

  accessibility: # UNCHANGED
    full: 50
    minimal: 0

  win_condition: # UNCHANGED
    collect_louie: 50
    collect_pokos: 0
    collect_treasure: 0

  poko_amount: # UNCHANGED
    10000: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-26985: 0 # random value between 0 and 26985

  treasure_amount: # UNCHANGED
    201: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-201: 0 # random value between 1 and 201

  debt: # At default 10000 was way to early, I got so many treasures from another player that I could immediately clear the Debt and then go straight to the final boss.
    15000: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-15000: 0 # random value between 1 and 15000

  shuffle_caves: # It was obvious that Dream Den should be in Wistful Wild to make the game last longer.
    no_shuffle: 0
    keep_dream_den: 50
    wistful_wild_lock: 0
    full_shuffle: 0

  cave_keys: # Allow the Caves to be locked up.
    all_locked: 99

  death_link: # Allows either a Captain to go unconscious or create a Pikmin Extinction.
    full_random: 99

  boss_rando: # Bosses are randomly chosen for each location.
    vanilla: 0
    shuffle: 0
    full_random: 50

  enemy_rando: # Unchanged
    vanilla: 0
    full_random: 50

  boss_and_enemy_rando: # I did a test run and had a WHOLE Sublevel filled with Water Wraiths. Not letting this happen sadly. UNCHANGED
    'no': 50
    'yes': 0

  boss_enemy_rando_locations: # UNCHANGED
    caves_only: 0
    overworld_only: 0
    both: 50

  sublevel_shuffle: # Shuffles the sublevels around meaning a Boss level could be in between or at the start.
    vanilla: 0
    shuffled: 50

  onion_shuffle: # Puts all the onions in a pool, but makes sure to pick one for the start.
    vanilla: 0
    shuffle: 0
    exclude_vanilla: 0
    in_pool: 50

  progressive_globes: # UNCHANGED
    non_progressive: 50
    progressive: 0

  weapons_in_pool: # UNCHANGED
    'no': 50
    'yes': 0

  treasure_collection_checks: # UNCHANGED
    'no': 50
    'yes': 0

  treasure_collection_start_value: # UNCHANGED
    5: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-201: 0 # random value between 1 and 201

  treasure_collection_end_value: # UNCHANGED
    200: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-201: 0 # random value between 1 and 201

  treasure_collection_interval: # UNCHANGED
    5: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-201: 0 # random value between 1 and 201

  poko_collection_checks: # Extra useful to have checks.
    'no': 0
    'yes': 50

  filler_item_weights: # Ok this is cool, but I probably wouldn't mind the Sprays being more filler instead of Pikmin.
    Blue Pikmin: 12
    Purple Pikmin: 12
    Red Pikmin: 12
    Ultra-Bitter Spray: 19
    Ultra-Spicy Spray: 19
    White Pikmin: 12
    Yellow Pikmin: 12

  filler_pikmin_amount: # UNCHANGED
    15: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-1000: 0 # random value between 1 and 1000

  filler_pikmin_leaves: # Makes all Filler Pikmin pick a random type of leaf.
    leaf: 0
    bud: 0
    flower: 0
    full_random: 50

  local_items: []

  non_local_items: []

  start_inventory: {}

  start_hints: []

  start_location_hints: []

  exclude_locations: []

  priority_locations: []

  item_links: []

  plando_items: []
