name: ZeromanLM{NUMBER}

description: 'Zeroman95s Luigis Mansion YAML'

game: Luigi's Mansion
requires:
  version: 0.6.7
  game:
    Luigi's Mansion: 0.6.4

Luigi's Mansion:
  progression_balancing:
    60: 99

  accessibility: # UNCHANGED
    full: 50
    minimal: 0

  furnisanity: # TODO Come back later
    # SANITY CHECK LIST
    # Nothing - If no Sanity is turned on the whole default run is 82 Checks.
    # Hangables - Adds 67 Checks
    # Decor - Adds 165 Checks
    # Ceiling - Adds 50 Checks
    # Candles - Adds 28 Checks
    # Seating - Adds 54 Checks
    # Surfaces - Adds 30 checks
    # Storage - Adds 81 Checks
    # Plants - Adds 26 Checks
    # Drawers - Adds 38 Checks
    # Treasures - Adds 126 Checks
    # Basement - Adds 52 Checks
    # Full - Adds 538 Checks
    []

  toadsanity:
    'false': 0
    'true': 50

  gold_mice: # UNCHANGED
    'false': 50
    'true': 0

  boosanity: # Capturing a Boo gives checks now, Boos are now Items in the Pool.
    'false': 0
    'true': 50

  portrification: # All Portrait Ghosts give checks.
    'false': 0
    'true': 50

  silver_ghosts: # UNCHANGED
    'false': 50
    'true': 0

  gold_ghosts: # UNCHANGED
    'false': 50
    'true': 0

  speedy_spirits: # UNCHANGED
    'false': 50
    'true': 0

  lightsanity: # UNCHANGED
    'false': 50
    'true': 0

  walksanity: # UNCHANGED
    'false': 50
    'true': 0

  grassanity: # UNCHANGED
    'false': 50
    'true': 0

  WDYM_checks: # UNCHANGED
    'false': 50
    'true': 0

  rank_requirement: # Ranks in this game do matter; Even then it doesn't do much to render the game unplayable considering the AMOUNT of Gems and Diamonds you can find in the game. rank_h is lower because rank_h means you don't need any money making it worthless.
    rank_h: 12
    rank_g: 12
    rank_f: 12
    rank_e: 12
    rank_d: 12
    rank_c: 12
    rank_b: 12
    rank_a: 12

  game_mode: # UNCHANGED
    default: 50
    poltergust_hunt: 0

  vacuum_start: # Start without the Polterguist 3000
    'false': 50
    'true': 0

  mario_items: # UNCHANGED
    5: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-5: 0 # random value between 0 and 5

  boo_gates: # UNCHANGED
    'false': 0
    'true': 50

  balcony_boo_count: # Set random amount of Boo's required for Balcony
    random-range-0-50: 99

  final_boo_count: # 30 to 50 Boo's will be required to do the Final Fight
    random-range-30-50: 99

  enemizer: # Elements switched off, because I would keep getting Water Ghosts and I would never get that element until right at the end
    no_elements: 99

  door_rando: # Require a key for each door to even go in there
    all_doors_locked: 99

  random_spawn: # This is literally the best feature this AP has to offer
    'false': 0
    'true': 50

  early_first_key: # Need this otherwise stuck in my spawn room for the next 30 to 60 Minutes
    'false': 0
    'true': 50

  walk_speed: # UNCHANGED
    normal_speed: 50
    kinda_fast: 0
    schmoovin: 0

  luigi_max_health: # Makes the game a challenge
    random-range-50-150: 99

  enable_fear_animation: # UNCHANGED
    'false': 0
    'true': 50

  enable_pickup_animation: # UNCHANGED
    'false': 0
    'true': 50

  self_item_messages: # UNCHANGED
    all_messages: 50
    progression_items_only: 0
    nothing: 0

  death_link: # Turned on to go good night
    'false': 0
    'true': 50

  trap_link: # Turned on to allow trap links in other games
    'false': 0
    'true': 50

  enable_trap_client_msg: # UNCHANGED
    'false': 0
    'true': 50

  energy_link: # UNCHANGED
    'false': 50
    'true': 0

  ring_link: # UNCHANGED
    'false': 50
    'true': 0

