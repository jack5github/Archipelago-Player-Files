    random-range-199-300: 99

  random_music: # UNCHANGED
    'false': 50
    'true': 0

  door_model_rando: # UNCHANGED
    'false': 50
    'true': 0

  chest_types: # I like unique chests
    full_random: 99

  trap_chests: # Contains... Anything?
    anything: 99

  spookiness: # UNCHANGED
    vanilla: 50
    full_spooky: 0
    random_rooms: 0

  call_mario: # Every time Mario is called, it sends a Message to Client
    'false': 0
    'true': 50

  filler_weights: # UNCHANGED
    Bars: 10
    Bills: 10
    Bundles: 10
    Coins: 15
    Dust: 40
    Gems: 5
    Hearts: 10

