    'false': 0
    'true': 50

  send_hints: # UNCHANGED
    'false': 0
    'true': 50

  king_boo_health: # Pick a set amount of health for King Boo between 500 and 1000.
    random-range-500-1000: 99

  boolossus_difficulty: # UNCHANGED
    easy: 0
    normal: 50
    hard: 0

  boo_health_option: # Depending on what Sphere the Boo is in its the amount of health
    boo_health_by_sphere: 99

  boo_health_value: # Make the Boos an annoyance
    random-range-199-300: 99

  boo_speed: # Sets amount of speed for every Boo in the game
    random-range-1-36: 99

  boo_escape_time: # Allow Boo's to have random amount of time to leave the room
