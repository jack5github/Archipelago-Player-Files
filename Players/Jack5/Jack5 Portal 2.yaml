name: Jack5Portal2{NUMBER}
description: |-
  Jack5's Portal 2 player file

  This Portal 2 configuration adjusts the potential randomisation of the game to be more suitable for playing it in conjunction with other games. Traps are maxed out, and the accessible maps are restricted to ensure more levels get played, removing those where nothing happens.
game: Portal 2
requires:
  version: 0.6.7
  game:
    Portal 2: 0.8.0
Portal 2:
  ################
  # Game Options #
  ################
  progression_balancing:
    # Played this with Zeroman95 on Johnny Upgrade, and I felt like I had too much responsibility because of how long it took me to get checks, so I'm adjusting the balancing to be harder (not too hard though, because Johnny Upgrade unlocks checks way too fast).
    45: 50
  accessibility:
    # Unchanged from the base configuration.
    full: 50
  death_link:
    # When you die, everyone who enabled death link dies. Of course, the reverse is true too.
    # "No need to be selfish, luv, you're gonna die." - Wheatley
    'false': 0
    'true': 50
  ####################
  # Location Options #
  ####################
  game_mode:
    # What map generation and logic options are set:
    # normal -> Each chapter is randomised with it's own maps
    # chaotic -> Any map can be in any chapter
    # open_world -> maps appear in the correct order in the game and are all playable from the start
    # Normal is too predictable, and Open World allows me to access the final map immediately, which could result in the game ending too quickly. For that reason, I only play Chaos, CHAOS!
    normal: 0
    chaotic: 50
    open_world: 0
  early_playability_percentage:
    # What percentage of starting maps are in the first round of map selection
    # Minimum of 60 -> Over half of the starting maps are available from the get go, slightly slower start
    # Maximum of 100 -> All starting maps are available from the get go, a very quick start
    # You can define additional values between the minimum and maximum values. Minimum value is 60, maximum value is 100.
    # Portal 2 becomes boring the more Chapter 1 levels are made available at the start of the game, so I have set this option to its absolute minimum.
    60: 50
  logic_difficulty:
    # If logic should be for the average player or for an experienced glitch speedrunner
    # normal -> assumes you have everything required to beat the level
    # speedrunner -> assumes you know difficult speedrun techniques for the whole game including some sla tricks, experimental
    # (if you don't speedrun the game don't choose this option)
    # Unchanged from the base configuration.
    normal: 50
    speedrunner: 0
  remove_locations:
    # Which maps will be removed entirely from the map pool.
    # Different from Excluded Locations as Removed Locations will not be playable during the game. Excluded Locations are still in the map pool.
    # These are maps that I would rather not play, mainly those that scarcely make use of the Portal Gun and require lots of walking.
    # Chapter 1
    - Container Ride Completion
    - Secret Panel Completion
    - Wake Up Completion
    # Chpater 5
    - Neurotoxin Sabotage Completion
    - Turret Factory Completion
    - Turret Sabotage Completion
    - Core Completion
    # Chapter 6
    - Cave Johnson Completion
    # Chapter 9
    - Finale 1 Completion
  cutscene_levels:
    # Determines whether cutscene maps are added to the map pool
    # I do not want to have to watch cutscenes to progress.
    'false': 50
    'true': 0
  wheatley_monitors:
    # Determines whether breaking Wheatly monitors will send location checks
    # This option is a must in order to increase the number of locations.
    'false': 0
    'true': 50
  ratman_dens:
    # Determines whether locating Ratman Dens will send location checks
    # This option is a must in order to increase the number of locations.
    'false': 0
    'true': 50
  vitrified_doors:
    # Determines whether locating Vitrified Doors will send location checks
    # This seems like an interesting way to increase the number of locations.
    'false': 0
    'true': 50
  ################
  # Trap Options #
  ################
  trap_fill_percentage:
    # Replace a percentage of junk items in the item pool with random traps
    # You can define additional values between the minimum and maximum values. Minimum value is 0, maximum value is 100.
    # Portal 2 is a unique case, as it is played in short, sporadic bursts, so traps need to be a near-constant presence. I have tried 20%, 30%, and even my usual range of 50-80%, but these weren't enough, so I'm making every single filler item a trap.
    100: 50
  motion_blur_trap_weight:
    # Likelihood of receiving a trap which makes it a little hard to see
    # Unchanged from the base configuration.
    none: 0
    low: 0
    medium: 50
    high: 0
  fizzle_portal_trap_weight:
    # Likelihood of receiving a trap which fizzles ALL portals on the map
    # Unchanged from the base configuration.
    none: 0
    low: 0
    medium: 50
    high: 0
  butter_fingers_trap_weight:
    # Likelihood of receiving a trap which makes it a little hard to hold items
    # Unchanged from the base configuration.
    none: 0
    low: 0
    medium: 50
    high: 0
  cube_confetti_trap_weight:
    # Likelihood of receiving a trap which makes an explosion of colorful cubes at your feet
    # The Cube Confetti Trap triggers earrape, so I'm reducing the chance of it.
    none: 0
    low: 50
    medium: 0
    high: 0
  slippery_floor_trap_weight:
    # Likelihood of receiving a trap which makes Chell slip and slide
    # Unchanged from the base configuration.
    none: 0
    low: 0
    medium: 50
    high: 0
  ###########################
  # Item & Location Options #
  ###########################
  local_items: []
  non_local_items: []
  start_inventory: {}
  start_inventory_from_pool:
    # Lasers and Laser Relays are already items that can be unlocked during a run. It doesn't make sense for catchers to be an item too, as this makes it take much longer to be able to use lasers in general. In addition to this, starting out with only one portal makes the majority of Portal 2 impossible to play, and if not given early, can result in Portal 2 being unplayable for the entire run.
    Laser Catchers: 1
    Upgraded Portal Gun: 1
  start_hints: []
  start_location_hints: []
  exclude_locations:
    # Do not consider the final map (Chapter 9) to be an important location. It causing all Portal 2-held items to be released is enough of a reward.
    - Finale 4 Completion
  priority_locations:
    # Ensure this chamber (Chapter 8) is expected to be played, as it is a map that requires a lot of items to progress, ensuring a more complete playthrough of Portal 2.
    - Laser Catapult Completion
  item_links:
    # Share Portal 2 puzzle elements between player files.
    - name: Portal2 Elements
      item_pool:
        - Upgraded Portal Gun
        - PotatOS
        - Weighted Cubes
        - Redirection Cubes
        - Spherical Cubes
        - Antique Cubes
        - Buttons
        - Antique Buttons
        - Floor Buttons
        - Antique Floor Buttons
        - Frankenturrets
        - Blue Gel
        - Orange Gel
        - White Gel
        - Lasers
        - Aerial Faith Plates
        - Excursion Funnels
        - Hard Light Bridges
        - Laser Relays
        - Laser Catchers
        - Turrets
      replacement_item: null
      skip_if_solo: true
  plando_items: []
