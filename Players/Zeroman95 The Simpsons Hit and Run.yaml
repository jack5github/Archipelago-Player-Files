name: ZeromanSHAR{NUMBER}

description: Zeroman95s The Simpsons Hit and Run YAML

game: Simpsons Hit and Run
requires:
  version: 0.6.7
  game:
    Simpsons Hit and Run: 0.5.4

Simpsons Hit and Run:
  progression_balancing:
    # UNCHANGED
    50: 99

  accessibility:
    # UNCHANGED
    full: 50
    minimal: 0

  Itchy_And_Scratchy_Ticket_Requirement:
    # Pick a random Goal for me to complete.
    missions_complete: 25
    story_missions_complete: 25
    final_mission_l7m7: 25
    cars_collected: 25

  Wasp_Amount:
    # Choose random amount of required destroyed Wasp Cameras before goal.
    random-range-0-140: 99

  Card_Amount:
    # Choose random amount of required Cards before Goal.
    random-range-0-49: 99

  Required_Mission_Levels:
    # UNCHANGED
    ['All']

  Car_Amount:
    # UNCHANGED
    50: 50

  Lock_Levels:
    # UNCHANGED
    'false': 0
    'true': 50

  Early_Level:
    # UNCHANGED
    'false': 0
    'true': 50

  Shuffle_Levels:
    # UNCHANGED
    'false': 0
    'true': 50

  Starting_Car_Shuffle:
    # UNCHANGED
    'false': 0
    'true': 50

  Shuffle_Attack:
    # UNCHANGED
    ['All']

  Shuffle_Jump:
    # UNCHANGED
    ['All']

  Start_Jump_Level:
    # UNCHANGED
    1: 50

  Shuffle_Gagfinder:
    # UNCHANGED
    ['All']

  Shuffle_Checkered_Flags:
    # UNCHANGED
    ['All']

  Shuffle_EBrakes:
    # UNCHANGED
    ['All']

  Shuffle_Bumpers:
    # UNCHANGED
    ['None']

  Start_With_Bumpers:
    # UNCHANGED
    'false': 50
    'true': 0

  Shuffle_Forward:
    # UNCHANGED
    ['None']

  Early_Forward:
    # UNCHANGED
    ['All']

  Shuffle_Cards:
    # UNCHANGED
    'false': 0
    'true': 50

  Mission_Locks:
    # I am going to try this for my next run. I have no idea how this works but apparently this makes certain cars required for certain missions.
    random-range-0-100: 99

  Mission_Timers:
    # UNCHANGED
    0: 50

  Min_Shop_Price:
    # Changed to make the Shop Prices completely random.
    random-range-0-500: 99

  Max_Shop_Price:
    # Changed to make the Shop Prices completely random.
    random-range-0-500: 99

  Shop_Scale_Modifier:
    # UNCHANGED
    2: 50

  Start_Wallet_Level:
    # UNCHANGED
    1: 50

  Shop_Hint_Policy:
    # UNCHANGED
    all: 50

  Extra_Hint_Policy:
    # UNCHANGED
    'false': 0
    'true': 50

  Filler_Wrench_Efficiency:
    # Just like the Efficiency for Hit N Run Resets, you need many wrenches to even repair.
    100: 99

  Filler_HitNRun_Reset_Efficiency:
    # I liked it when it decreased the whole meter. Plus you need loads of these to even lower the meter if this is set to only 10.
    100: 99

  Shuffle_Traffic:
    # UNCHANGED
    'false': 0
    'true': 50

  Traffic_Blacklist:
    # UNCHANGED
    []

  Filler_Traps:
    # Set to 90% to make SHAR more challenging because nothing special really happens with the filler items.
    90: 99

  Enable_Eject_Traps:
    # Barely does anything in-game all it does is force my character to leave the vehicle.
    'false': 50
    'true': 0

  Enable_Duff_Traps:
    # UNCHANGED
    'false': 0
    'true': 50

  Enable_Launch_Traps:
    # UNCHANGED
    'false': 0
    'true': 50

  Enable_HitNRun_Traps:
    # UNCHANGED
    'false': 0
    'true': 50

  Enable_Traffic_Traps:
    # Doesn't do much, just blows up nearby Traffic.
    'false': 50
    'true': 0

