name: MultiCrashout{NUMBER}
description: |-
  Multiplayer Crashout Crew player file by Jack5

  TODO: Add description
game: Crashout Crew
requires:
  version: 0.6.7
  game:
    Crashout Crew: 1.0.0
Crashout Crew:
  ################
  # Game Options #
  ################
  # Unchanged.
  progression_balancing:
    normal: 50
  accessibility:
    full: 50
  two_order_contracts:
    # How many contracts with two orders should be included
    # You can define additional values between the minimum and maximum values. Minimum value is 0, maximum value is 3.0.
    # Reduced from 3 due to 2-object contracts feeling samey.
    2: 50
  three_order_contracts:
    # How many contracts with three orders should be included
    # You can define additional values between the minimum and maximum values. Minimum value is 0, maximum value is 3.0.
    # Unchanged.
    3: 50
  four_order_contracts:
    # How many contracts with four orders should be included
    # You can define additional values between the minimum and maximum values. Minimum value is 0, maximum value is 3.0.
    # Unchanged.
    3: 50
  ###########################
  # Item & Location Options #
  ###########################
  local_items: []
  non_local_items: []
  start_inventory:
    # It is confusing to play Crashout Crew with one less carry capacity to start with, so begin with the base carry capacity.
    Base Strength Upgrade: 1
  start_hints: []
  start_location_hints: []
  exclude_locations: []
  priority_locations: []
  item_links: []
  plando_items: []
