name: ZeromanPEAK{NUMBER}

description: Zeroman95s PEAK YAML File

game: PEAK
requires:
  version: 0.6.7

PEAK:
  progression_balancing:
    random-range-50-80: 99 # set to random-range-50-80 to give better items and to make the game go quicker.

  accessibility: # UNCHANGED
    full: 50
    minimal: 0

  goals: # UNCHANGED
    # The goals of the seed. Every selected goal must be completed.
    #
    # Reach Peak: Reach the peak on the ascent level specified by Required Ascent Count
    #
    # Collect Badges: Collect the number of badges specified by Required Badge Count
    #
    # 24 Karat Badge: Toss the Ancient Idol into The Kiln's lava
    #
    # Free The Soul: Free the Scoutmaster's soul in [REDACTED]
    ['Reach Peak']

  ascent_count: # No Ascents required
    0: 99

  badge_count: # UNCHANGED NOT USING.
    20: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-54: 0 # random value between 1 and 54

  item_sanity: # Send it.
    'false': 0
    'true': 50

  loot_sanity: # All locations to find loot are random.
    none: 0
    luggage: 0
    trees_and_bushes: 0
    all: 99

