name: ZeromanFNaFW{NUMBER}

description: 'Zeroman95s FNaF WORLD Yaml'

game: FNaFW
requires:
  version: 0.6.7

FNaFW:
  progression_balancing: # UNCHANGED
    50: 50

  accessibility: # UNCHANGED
    full: 50
    minimal: 0

  ending_goal: # Removed Update 2 Goals to only have Update 1 Goals
    scott: 20
    clock: 20
    fourth_glitch: 20
    universe_end: 20
    chipper: 20

  initial_characters: # True Random and no Halloween is not working for me, so it is now swapped to limited_random
    limited_random: 99

  vanilla_halloween: # No
    'false': 50
    'true': 0

  vanilla_lasers: # Lasers get added to the Pool for progress
    'false': 0
    'true': 50

  vanilla_pearl: # Pearl is in Pool and Pearl in the Fish Minigame is a check
    'false': 0
    'true': 50

  hard_logic: # UNCHANGED
    'false': 50
    'true': 0

  cheap_shop: # I get plenty of Tokens as Items in the pool anyway so this does not matter
    'false': 50
    'true': 0

  require_find_char: # This Setting is stupid and should be changed
    'false': 50
    'true': 0

  progressive_anims: # UNCHANGED
    'false': 0
    'true': 50

  progressive_bytes: # UNCHANGED
    'false': 50
    'true': 0

  progressive_chips: # Random chips are obtained
    'false': 50
    'true': 0

  area_warping: # Makes all Areas ingame be an Item that is required to teleport there or even go there normally
    always: 99

  fazcoin_chests: # UNCHANGED
    3: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-3: 0 # random value between 1 and 3

  halloween_minigame: # Nope do not want to do Update 2
    'false': 50
    'true': 0

  local_items: []

  non_local_items: []

  start_inventory: {}

  start_hints: []

  start_location_hints: []

  exclude_locations: # Excludes Halloween Character locations
    [
      'Jack-O-Bonnie',
      'Jack-O-Chica',
      'Animdude',
      'Mr. Chipper',
      'Nightmare BB',
      'Nightmarionne',
      'Coffee',
      'Purpleguy',
    ]

  priority_locations: ['Fazbear Hills: Pearl'] # Makes Pearl be an important location

  item_links: []

  plando_items: []
