name: Jack5Cartogr{NUMBER}
description: |-
  Jack5's CartogrAP player file

  CartogrAP is a tile-based exploration game that is similar to the overworld of FNAF World. It has an abnormally high number of locations, specifically featuring (at minimum) 500 cells that must be individually walked to, and as such, is not enjoyable to play in a solo context without aggressive changes. This player file attempts to implement those changes to minimise the amount of walking and backtracking standard Archipelago randomisation necessitates. This is done mainly by forcing cells to be within their own regions or in other worlds. Also, grindy locations (fishing and treasure hunting) are excluded, meaning it is not necessary to purchase fishing upgrades from the shop, making Money items more valuable.
game: CartogrAP
requires:
  version: 0.6.7
  game:
    CartogrAP: 1.3.0
CartogrAP:
  ################
  # Game Options #
  ################
  progression_balancing:
    # It is not enjoyable to play CartogrAP for extended periods of time, as it involves a lot of backtracking.
    40: 50
  accessibility:
    # It isn't strictly necessary to access every single item of CartogrAP's in order to complete it.
    minimal: 50
  ########
  # Meta #
  ########
  cell_count:
    # How many cells to generate?
    # Reduced from the default of 750 (originally 1000) to the lowest possible cell count in order to minimise the pain of backtracking.
    '500': 50
    '750': 0
    '1000': 0
    '1250': 0
    '1500': 0
    '1750': 0
    '2000': 0
  ###########################
  # Item & Location Options #
  ###########################
  local_items: []
  non_local_items: []
  start_inventory: {}
  start_hints: []
  start_location_hints: []
  exclude_locations:
    # Fishing is a tedious exercise of waiting for fish to appear, and it sucks to get stuck in this cycle, so disable fishing entirely.
    - Catch Largemouth Bass
    - Catch Bluegill
    - Catch Kokanee Salmon
    - Catch Black Bullhead Catfish
    - Catch Rainbow Trout
    - Catch Golden Trout
    - Catch Arctic Grayling
    - Catch Derp Fish
    - Catch Cat In Quotation Marks Fish
    - Catch Yellow Perch
    - Catch Razorback Sucker
    - Catch Black Crappie
    # Treasure Hunt quests are annoying because the treasure isn't always found in the zone featured in the location name.
    - Plain Cell Treasure Hunt Quest
    - Forest Cell Treasure Hunt Quest
    - Bog Cell Treasure Hunt Quest
    - Ocean Cell Treasure Hunt Quest
    - Cave Cell Treasure Hunt Quest
    - Sky Cell Treasure Hunt Quest
  priority_locations:
    # TODO: Use group name once location groups are added to the game
    # Treasure chests need to be progression items, otherwise they feel lackluster. Regarding these, the following restrictions apply:
    # - 'X Cell Region Chest' locations cannot be progression-only, because they are used to check whether the game is complete, and cause generation to fail if set as such.
    # - 'X Cell Unlocked Chest 1' locations cannot be progression-only due to the low cell count, causing generation to fail if set as such.
    - Plain Cell Unlocked Chest 2
    - Forest Cell Unlocked Chest 2
    - Bog Cell Unlocked Chest 2
    - Ocean Cell Unlocked Chest 2
    - Cave Cell Unlocked Chest 2
    - Sky Cell Unlocked Chest 2
    - Plain Cell Unlocked Chest 3
    - Forest Cell Unlocked Chest 3
    - Bog Cell Unlocked Chest 3
    - Ocean Cell Unlocked Chest 3
    - Cave Cell Unlocked Chest 3
    - Sky Cell Unlocked Chest 3
    - Plain Cell Unlocked Chest 4
    - Forest Cell Unlocked Chest 4
    - Bog Cell Unlocked Chest 4
    - Ocean Cell Unlocked Chest 4
    - Cave Cell Unlocked Chest 4
    - Sky Cell Unlocked Chest 4
    # Quests (except Treasure Hunt quests) are important milestones that deserve to be important locations. The only exception to this is the 'Sky Cell Shortest Path Quest', because it is easy to cheese by dying at the start of the quest.
    - Plain Cell Speedrun Quest
    - Forest Cell Speedrun Quest
    - Bog Cell Speedrun Quest
    - Ocean Cell Speedrun Quest
    - Cave Cell Speedrun Quest
    - Sky Cell Speedrun Quest
    - Plain Cell Shortest Path Quest
    - Forest Cell Shortest Path Quest
    - Bog Cell Shortest Path Quest
    - Ocean Cell Shortest Path Quest
    - Cave Cell Shortest Path Quest
  item_links: []
  plando_items:
    # With 500 cells, there are 38 Plain Cells and 40 of each of the other cell types. This plando consists of two changes:
    # - A small minority of cells (5) from each region (totalling 30) are forced to be found in other players' worlds. This reduces the responsibility of the game by ~15%. (`non_local_items` cannot be used as it would conflict with `plando_items`.)
    # - The remaining majorities of cells (33 + (35 * 5) = 208) are forced to be found in their respective regions. This reduces the amount of backtracking that needs to be done when playing the game.
